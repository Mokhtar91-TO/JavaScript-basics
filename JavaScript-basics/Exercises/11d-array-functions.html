        function addArrays(array1,array2){
          let result=[];
          if(array1.length<array2.length){

            let i=0;
            while(i<array1.length){
              result[i]=array1[i]+array2[i];
              i++;
            }

            for(let j=i;j<array2.length;j++){

            }

              i++;
            }

            for(let j=i;j<array1.length;j++){

            }
          }

       function minArray(nums){
        let min=0;
        for(let i=0;i<nums.length;i++){
          if(min>nums[i]){
            min=nums[i];
          }
        }
        return min;
       }

       function maxArray(nums){
        let max=0;
        for(let i=0;i<nums.length;i++){
          if(max<nums[i]){
            max=nums[i];
          }
        }
        return max;
       }

       function minMax(nums){

        let result={
          min:0,
          max:0,
        };

        if(nums.length===0){
          result.max=null;
          result.min=null;
        }else if(nums.length===1){
          result.max=nums[0];
          result.min=nums[0];
        }else{

          result.max= maxArray(nums);
         result.min=minArray(nums);

        }

        return result;
       }

      function countWords(words){
        let result={};

        for(let i=0;i<words.length;i++){
          const word = words[i];

          if(!result[word]){
            result[word]=1;
          }else {
            result[word]++;
          }
        }
        return result;
      }

      console.log(countWords(['apple', 'grape', 'apple', 'apple']));



      

      function findindex(array,word){

          let i=0;
          let found = false;

          while(i<array.length){
            if(array[i]===word){
              
              found=true;
              break;
            }
            i++;
          }
          if(found===false){
            return -1;
          }

      }

       function unique(array){

       let result=[];

       for(let i=0;i<array.length;i++){
        const word = array[i];

        if(findindex(result,word)===-1){
          result.push(word);
        }
       }

       return result;
       }
