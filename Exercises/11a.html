<body>


  <script>
    const array1=[1,20,22,24,5];
    function arraySwap(array){
      let array2=[];
      const firstValue=array[0];
      const lastValue=array[array.length-1]
      array2[0]=lastValue;
      array2[array.length-1]=firstValue;
      for(let i=1;i<array.length-1;i++){
        array2[i]=array[i];
      }
      return array2;
    }

    console.log(arraySwap(array1));

  </script>
  
</body>
