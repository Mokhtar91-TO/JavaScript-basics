<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12a</title>
</head>
<body>

  <button class="js-start-button" onclick="
    finished();
    ">Start</button>




  <script>
    

    function finished(){
      const button=document.querySelector('.js-start-button');
      button.innerHTML='Loading...';
      setTimeout(function(){
        button.innerHTML='Finished';
      }, 1000) 
    }

  </script>
</body>
</html>
