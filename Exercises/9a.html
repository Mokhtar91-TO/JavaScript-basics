<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9a</title>
</head>
<body>

  <input placeholder="Type your name" class="js-input-name" onkeydown="
     handleKeydown(event);
    ">
  <button onclick="
    displayName();
  ">Submit</button>
  <p class="js-display-name"></p>

  <script>

   function handleKeydown(event){
       if(event.key==='Enter'){
         displayName();
       }
   }

    function displayName(){
       const text=document.querySelector('.js-input-name').value;
      document.querySelector('.js-display-name').innerHTML=`Your name is: ${text}`;
    }
   
  </script>
  
</body>
</html>
