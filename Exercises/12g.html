<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App</title>
</head>
<body>

    <button class="js-Add" onclick="
      Add();
      displayNotification();
      ">
      Add
    </button>
    <button class="js-remove" onclick="
    Remove();
    displayNotification();
    ">
      Remove
    </button>

  <script>

    let messages = 2;
    let intervalId;

    let isDisplayinNotification;

    displayNotification();

    function displayNotification(){
      if(messages ===0){
        stopNotification();
        return;
      }

      if(isDisplayinNotification){
        return;
      }

      isDisplayinNotification=true;

      intervalId = setInterval(function(){
        if(document.title==='App'){
          document.title=`(${messages}) New messages`
        } else {
          document.title='App'
        }
      }, 1000);
    };

    function stopNotification (){
      isDisplayinNotification = false;
      clearInterval(intervalId);
      document.title='App';
    }

    function Add(){
      messages=messages+1;
    }

    function Remove(){
      if(messages>0){
         messages=messages-1;
      } 
       if(messages===0){
        stopNotification();
      }
    };
   

  </script>
</body>
</html>
