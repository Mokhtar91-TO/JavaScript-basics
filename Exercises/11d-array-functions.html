       function minArray(nums){
        let min=0;
        for(let i=0;i<nums.length;i++){
          if(min>nums[i]){
            min=nums[i];
          }
        }
        return min;
       }

       function maxArray(nums){
        let max=0;
        for(let i=0;i<nums.length;i++){
          if(max<nums[i]){
            max=nums[i];
          }
        }
        return max;
       }

       function minMax(nums){

        let result={
          min:0,
          max:0,
        };

        if(nums.length===0){
          result.max=null;
          result.min=null;
        }else if(nums.length===1){
          result.max=nums[0];
          result.min=nums[0];
        }else{

          result.max= maxArray(nums);
         result.min=minArray(nums);

        }

        return result;
       }

      function countWords(words){
        let result={};

        for(let i=0;i<words.length;i++){
          const word = words[i];

          if(!result[word]){
            result[word]=1;
          }else {
            result[word]++;
          }
        }
        return result;
      }
