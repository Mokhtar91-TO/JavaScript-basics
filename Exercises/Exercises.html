<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Equation Calculator</title>
</head>
<body>
  <h1>Equation Calculator</h1>

  <form id="calculator-form">
    <input id="first-number" type="number" step="any" placeholder="First number" required>
    <select id="operator" aria-label="Mathematical operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
    <input id="second-number" type="number" step="any" placeholder="Second number" required>
    <button type="submit">Calculate</button>
  </form>

  <p id="result">Result: </p>

  <script src="Exercises.js"></script>
</body>
</html>
